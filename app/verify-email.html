<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Email Verification - ThinkCNAP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="auth.js"></script>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full mx-4">
    <div id="verification-container" class="bg-gray-800 p-8 rounded-lg text-center">
      <h1 class="text-2xl font-bold text-cyan-300 mb-4">Email Verification</h1>
      <div id="verification-content">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-cyan-300 mx-auto mb-4"></div>
        <p class="text-gray-300">Verifying your email...</p>
      </div>
    </div>
  </div>

  <script>
    let auth;
    
    document.addEventListener('DOMContentLoaded', async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const verificationToken = urlParams.get('token');
      const container = document.getElementById('verification-content');
      
      if (!verificationToken) {
        container.innerHTML = `
          <div class="text-red-400 mb-4">
            <svg class="w-16 h-16 mx-auto mb-4" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
            </svg>
            <h2 class="text-xl font-semibold mb-2">Invalid Verification Link</h2>
            <p class="text-gray-300 mb-4">This verification link is invalid or missing the required token.</p>
          </div>
          <a href="/" class="inline-block px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded">
            Return to Login
          </a>
        `;
        return;
      }
      
      // Initialize auth
      auth = new ThinkCNAPAuth();
      while (!auth.isInitialized) {
        await new Promise(resolve => setTimeout(resolve, 100));
      }
      
      // Verify email
      const result = await auth.verifyEmail(verificationToken);
      
      if (result.success) {
        container.innerHTML = `
          <div class="text-green-400 mb-4">
            <svg class="w-16 h-16 mx-auto mb-4" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
            </svg>
            <h2 class="text-xl font-semibold mb-2">Email Verified Successfully!</h2>
            <p class="text-gray-300 mb-4">${result.message}</p>
          </div>
          <a href="/" class="inline-block px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded">
            Access Dashboard
          </a>
        `;
        
        // Redirect to dashboard after 3 seconds
        setTimeout(() => {
          window.location.href = '/';
        }, 3000);
        
      } else {
        container.innerHTML = `
          <div class="text-red-400 mb-4">
            <svg class="w-16 h-16 mx-auto mb-4" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
            </svg>
            <h2 class="text-xl font-semibold mb-2">Verification Failed</h2>
            <p class="text-gray-300 mb-4">${result.error}</p>
          </div>
          <div class="space-y-2">
            <a href="/" class="block px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded">
              Return to Login
            </a>
            <button onclick="requestNewVerification()" 
                    class="block w-full px-4 py-2 bg-gray-600 hover:bg-gray-500 text-white rounded">
              Request New Verification Email
            </button>
          </div>
        `;
      }
    });
    
    async function requestNewVerification() {
      const email = prompt('Please enter your email address:');
      if (!email) return;
      
      const result = await auth.resendVerificationEmail(email);
      
      if (result.success) {
        alert(result.message);
      } else {
        alert(result.error);
      }
    }
  </script>
</body>
</html>
