<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ThinkCNAP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="text-white">
    <!-- Header -->
    <header class="bg-gray-900 shadow-lg border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-4">
                    <h1 class="text-2xl font-bold text-cyan-400">ThinkCNAP Administration Panel</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <div id="admin-user-info" class="text-gray-300"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Tab Navigation -->
        <div class="mb-8">
            <nav class="flex space-x-8" aria-label="Tabs">
                <button id="tab-users" class="admin-tab active" onclick="showTab('users')">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path>
                    </svg>
                    Users
                </button>
                <button id="tab-domains" class="admin-tab" onclick="showTab('domains')">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                    Domains
                </button>
                <button id="tab-controls" class="admin-tab" onclick="showTab('controls')">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    Controls
                </button>
                <button id="tab-measures" class="admin-tab" onclick="showTab('measures')">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                    </svg>
                    Measures
                </button>
                <button id="tab-mitre" class="admin-tab" onclick="showTab('mitre')">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                    MITRE TTP
                </button>
            </nav>
        </div>

        <!-- Tab Content -->
        <div id="content-users" class="tab-content">
            <div class="bg-gray-800 rounded-lg shadow-lg p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold text-cyan-400">User Management</h2>
                    <button onclick="showAddUserModal()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition-colors">
                        Add User
                    </button>
                </div>
                <div id="users-table" class="overflow-x-auto">
                    <!-- Users table will be loaded here -->
                </div>
            </div>
        </div>

        <div id="content-domains" class="tab-content hidden">
            <div class="bg-gray-800 rounded-lg shadow-lg p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold text-cyan-400">Security Domains</h2>
                    <button onclick="showAddDomainModal()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition-colors">
                        Add Domain
                    </button>
                </div>
                <div id="domains-table" class="overflow-x-auto">
                    <!-- Domains table will be loaded here -->
                </div>
            </div>
        </div>

        <div id="content-controls" class="tab-content hidden">
            <div class="bg-gray-800 rounded-lg shadow-lg p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold text-cyan-400">Security Controls</h2>
                    <button onclick="showAddControlModal()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition-colors">
                        Add Control
                    </button>
                </div>
                <div id="controls-table" class="overflow-x-auto">
                    <!-- Controls table will be loaded here -->
                </div>
            </div>
        </div>

        <div id="content-measures" class="tab-content hidden">
            <div class="bg-gray-800 rounded-lg shadow-lg p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold text-cyan-400">Measures</h2>
                    <button onclick="showAddMeasureModal()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition-colors">
                        Add Measure
                    </button>
                </div>
                
                <!-- Filters -->
                <div class="mb-4 flex space-x-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Filter by Domain</label>
                        <select id="domain-filter" onchange="onDomainFilterChange()" class="bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white">
                            <option value="">All Domains</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Filter by Control</label>
                        <select id="control-filter" onchange="filterMeasures()" class="bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white">
                            <option value="">All Controls</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Filter by Tag</label>
                        <select id="tag-filter" onchange="filterMeasures()" class="bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white">
                            <option value="">All Tags</option>
                            <option value="aws">AWS</option>
                            <option value="kubernetes">Kubernetes</option>
                            <option value="ai">AI</option>
                        </select>
                    </div>
                </div>
                
                <div id="measures-table" class="overflow-x-auto">
                    <!-- Measures table will be loaded here -->
                </div>
            </div>
        </div>

        <div id="content-mitre" class="tab-content hidden">
            <div class="bg-gray-800 rounded-lg shadow-lg p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold text-cyan-400">MITRE TTP</h2>
                    <button onclick="showAddMitreModal()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition-colors">
                        Add MITRE TTP
                    </button>
                </div>
                <div id="mitre-table" class="overflow-x-auto">
                    <!-- MITRE TTP table will be loaded here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Modals will be added here dynamically -->
    <div id="modal-container"></div>

    <!-- Loading indicator -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-gray-800 rounded-lg p-6 flex items-center space-x-3">
            <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-cyan-400"></div>
            <span class="text-white">Loading...</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="auth.js"></script>
    <script>
        // Admin Panel JavaScript
        class AdminPanel {
            constructor() {
                this.currentTab = 'users';
                this.init();
            }

            async init() {
                // Check if user is admin
                await this.checkAdminAccess();
                
                // Load initial tab
                await this.loadTabContent('users');
                
                // Update user info
                this.updateUserInfo();
            }

            async checkAdminAccess() {
                const token = localStorage.getItem('think_cnap_token');
                if (!token) {
                    window.location.href = '/';
                    return;
                }

                try {
                    const response = await fetch('/api/admin/check', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (!response.ok) {
                        throw new Error('Access denied');
                    }
                } catch (error) {
                    alert('Access denied. Admin privileges required.');
                    window.location.href = '/';
                }
            }

            updateUserInfo() {
                const userData = localStorage.getItem('think_cnap_user');
                if (userData) {
                    const user = JSON.parse(userData);
                    const username = user.email ? user.email.split('@')[0].toLowerCase() : 'Admin';
                    
                    document.getElementById('admin-user-info').innerHTML = `
                        <div class="relative">
                            <button id="admin-user-dropdown-button" 
                                    class="flex items-center space-x-2 px-3 py-2 text-gray-300 hover:text-white hover:bg-gray-700 rounded-md transition duration-200"
                                    onclick="toggleAdminUserDropdown()">
                                <span>${username}</span>
                                <svg class="w-4 h-4 transition-transform duration-200" id="admin-dropdown-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                            
                            <div id="admin-user-dropdown-menu" 
                                 class="hidden absolute right-0 mt-2 w-48 bg-gray-800 rounded-md shadow-lg border border-gray-700 z-50">
                                <div class="py-1">
                                    <button onclick="window.location.href='/'; hideAdminUserDropdown();" 
                                            class="w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 hover:text-white transition duration-200">
                                        <div class="flex items-center space-x-2">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"></path>
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5a2 2 0 012-2h4a2 2 0 012 2v6H8V5z"></path>
                                            </svg>
                                            <span>Dashboard</span>
                                        </div>
                                    </button>
                                    <button onclick="adminSignOut();" 
                                            class="w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 hover:text-white transition duration-200">
                                        <div class="flex items-center space-x-2">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                                            </svg>
                                            <span>Sign Out</span>
                                        </div>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    // Add click outside listener to close dropdown
                    setTimeout(() => {
                        document.addEventListener('click', handleAdminClickOutside);
                    }, 100);
                }
            }

            async loadTabContent(tab) {
                this.showLoading();
                try {
                    switch (tab) {
                        case 'users':
                            await this.loadUsers();
                            break;
                        case 'domains':
                            await this.loadDomains();
                            break;
                        case 'controls':
                            await this.loadControls();
                            break;
                        case 'measures':
                            await this.loadMeasures();
                            break;
                        case 'mitre':
                            await this.loadMitre();
                            break;
                    }
                } catch (error) {
                    console.error('Error loading tab content:', error);
                    this.showError('Failed to load data');
                } finally {
                    this.hideLoading();
                }
            }

            async loadUsers() {
                const token = localStorage.getItem('think_cnap_token');
                const response = await fetch('/api/admin/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Failed to load users');
                
                const users = await response.json();
                this.renderUsersTable(users);
            }

            async loadDomains() {
                const token = localStorage.getItem('think_cnap_token');
                const response = await fetch('/api/admin/domains', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Failed to load domains');
                
                const domains = await response.json();
                this.renderDomainsTable(domains);
            }

            async loadControls() {
                const token = localStorage.getItem('think_cnap_token');
                const response = await fetch('/api/admin/controls', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Failed to load controls');
                
                const controls = await response.json();
                this.renderControlsTable(controls);
            }

            async loadMeasures() {
                const token = localStorage.getItem('think_cnap_token');
                const response = await fetch('/api/admin/measures', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Failed to load measures');
                
                const measures = await response.json();
                // Sort by Measure ID
                measures.sort((a, b) => (a.measure_id || '').localeCompare(b.measure_id || ''));
                this.renderMeasuresTable(measures);
            }

            renderUsersTable(users) {
                const html = `
                    <table class="min-w-full table-auto">
                        <thead>
                            <tr class="bg-gray-700">
                                <th class="px-4 py-2 text-left">ID</th>
                                <th class="px-4 py-2 text-left">Email</th>
                                <th class="px-4 py-2 text-left">Name</th>
                                <th class="px-4 py-2 text-left">Admin</th>
                                <th class="px-4 py-2 text-left">Created</th>
                                <th class="px-4 py-2 text-left">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${users.map(user => `
                                <tr class="border-b border-gray-600">
                                    <td class="px-4 py-2">${user.id}</td>
                                    <td class="px-4 py-2">${user.email}</td>
                                    <td class="px-4 py-2">${user.name || '-'}</td>
                                    <td class="px-4 py-2">
                                        <span class="px-2 py-1 rounded text-xs ${user.is_admin ? 'bg-red-600' : 'bg-gray-600'}">
                                            ${user.is_admin ? 'Yes' : 'No'}
                                        </span>
                                    </td>
                                    <td class="px-4 py-2">${new Date(user.created_at).toLocaleDateString()}</td>
                                    <td class="px-4 py-2">
                                        <button onclick="editUser(${user.id})" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded text-xs mr-2">
                                            Edit
                                        </button>
                                        <button onclick="deleteUser(${user.id})" class="bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded text-xs">
                                            Delete
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                document.getElementById('users-table').innerHTML = html;
            }

            renderDomainsTable(domains) {
                const html = `
                    <table class="min-w-full table-auto">
                        <thead>
                            <tr class="bg-gray-700">
                                <th class="px-4 py-2 text-left">ID</th>
                                <th class="px-4 py-2 text-left">Name</th>
                                <th class="px-4 py-2 text-left">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${domains.map(domain => `
                                <tr class="border-b border-gray-600">
                                    <td class="px-4 py-2">${domain.id}</td>
                                    <td class="px-4 py-2">${domain.name}</td>
                                    <td class="px-4 py-2">
                                        <button onclick="editDomain(${domain.id})" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded text-xs mr-2">
                                            Edit
                                        </button>
                                        <button onclick="deleteDomain(${domain.id})" class="bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded text-xs">
                                            Delete
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                document.getElementById('domains-table').innerHTML = html;
            }

            renderControlsTable(controls) {
                const html = `
                    <table class="min-w-full table-auto">
                        <thead>
                            <tr class="bg-gray-700">
                                <th class="px-4 py-2 text-left">ID</th>
                                <th class="px-4 py-2 text-left">Code</th>
                                <th class="px-4 py-2 text-left">Text</th>
                                <th class="px-4 py-2 text-left">Domain</th>
                                <th class="px-4 py-2 text-left">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${controls.map(control => `
                                <tr class="border-b border-gray-600">
                                    <td class="px-4 py-2">${control.id}</td>
                                    <td class="px-4 py-2">${control.code}</td>
                                    <td class="px-4 py-2 max-w-xs truncate">${control.text}</td>
                                    <td class="px-4 py-2">${control.domain_name}</td>
                                    <td class="px-4 py-2">
                                        <button onclick="editControl(${control.id})" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded text-xs mr-2">
                                            Edit
                                        </button>
                                        <button onclick="deleteControl(${control.id})" class="bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded text-xs">
                                            Delete
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                document.getElementById('controls-table').innerHTML = html;
            }

            renderMeasuresTable(measures) {
                const html = `
                    <table class="min-w-full table-auto">
                        <thead>
                            <tr class="bg-gray-700">
                                <th class="px-4 py-2 text-left">ID</th>
                                <th class="px-4 py-2 text-left">Measure ID</th>
                                <th class="px-4 py-2 text-left w-2/5">Measure</th>
                                <th class="px-4 py-2 text-left w-48">Linked TTPs</th>
                                <th class="px-4 py-2 text-left w-40">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${measures.map(measure => `
                                <tr class="border-b border-gray-600">
                                    <td class="px-4 py-2">${measure.id}</td>
                                    <td class="px-4 py-2">${measure.measure_id}</td>
                                    <td class="px-4 py-2 max-w-sm break-words">${measure.measure}</td>
                                    <td class="px-4 py-2">
                                        ${measure.linked_ttps && measure.linked_ttps.length > 0 
                                            ? measure.linked_ttps.map(ttp => `<span class="inline-block bg-purple-600 text-white px-2 py-1 rounded text-xs mr-1 mb-1">${ttp.tactic}: ${ttp.technique}</span>`).join('')
                                            : '<span class="text-gray-500 text-xs">No TTPs linked</span>'
                                        }
                                    </td>
                                    <td class="px-4 py-2 whitespace-nowrap">
                                        <button onclick="editMeasure(${measure.id})" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded text-xs mr-2">
                                            Edit
                                        </button>
                                        <button onclick="deleteMeasure(${measure.id})" class="bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded text-xs">
                                            Delete
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                document.getElementById('measures-table').innerHTML = html;
            }

            async loadMeasures() {
                const [measuresList, controls, domains] = await Promise.all([
                    apiCall('/measures'),
                    apiCall('/controls'),
                    apiCall('/domains')
                ]);
                
                // Sort by Measure ID
                measuresList.sort((a, b) => (a.measure_id || '').localeCompare(b.measure_id || ''));
                
                // Store data for filtering
                this.allMeasures = measuresList;
                this.allControls = controls;
                this.allDomains = domains;
                
                // Populate filter dropdowns
                this.populateFilters();
                
                // Render table
                this.renderMeasuresTable(measuresList);
            }
            
            populateFilters() {
                // Load saved filter state
                const savedState = loadFilterState();
                
                // Populate domain filter
                const domainFilter = document.getElementById('domain-filter');
                if (domainFilter && this.allDomains) {
                    domainFilter.innerHTML = '<option value="">All Domains</option>' +
                        this.allDomains.map(domain => 
                            `<option value="${domain.id}">${domain.name}</option>`
                        ).join('');
                    
                    // Restore saved domain filter
                    if (savedState.domain) {
                        domainFilter.value = savedState.domain;
                    }
                }
                
                // Populate control filter (initially with all controls)
                const controlFilter = document.getElementById('control-filter');
                if (controlFilter && this.allControls) {
                    controlFilter.innerHTML = '<option value="">All Controls</option>' +
                        this.allControls.map(control => 
                            `<option value="${control.id}">${control.code} - ${control.text}</option>`
                        ).join('');
                }
                
                // Populate tag filter
                const tagFilter = document.getElementById('tag-filter');
                if (tagFilter) {
                    // Restore saved tag filter
                    if (savedState.tag) {
                        tagFilter.value = savedState.tag;
                    }
                }
                
                // If domain is selected, update controls dropdown and restore control filter
                if (savedState.domain && domainFilter) {
                    const selectedDomainId = parseInt(savedState.domain);
                    const domainControls = this.allControls.filter(control => 
                        control.domain_id === selectedDomainId
                    );
                    
                    controlFilter.innerHTML = '<option value="">All Controls</option>' +
                        domainControls.map(control => 
                            `<option value="${control.id}">${control.code} - ${control.text}</option>`
                        ).join('');
                }
                
                // Restore saved control filter
                if (savedState.control && controlFilter) {
                    controlFilter.value = savedState.control;
                }
                
                // Apply filters if any are set
                if (savedState.domain || savedState.control || savedState.tag) {
                    // Use setTimeout to ensure DOM is updated
                    setTimeout(() => {
                        filterMeasures();
                    }, 100);
                }
            }

            async loadMitre() {
                const mitreList = await apiCall('/mitre');
                this.renderMitreTable(mitreList);
            }

            renderMitreTable(mitreList) {
                const html = `
                    <table class="min-w-full table-auto">
                        <thead>
                            <tr class="bg-gray-700">
                                <th class="px-4 py-2 text-left">ID</th>
                                <th class="px-4 py-2 text-left">Tactic</th>
                                <th class="px-4 py-2 text-left">Technique</th>
                                <th class="px-4 py-2 text-left">Examples</th>
                                <th class="px-4 py-2 text-left">Actions</th>
                            </tr>
                        </thead>
                        <tbody>

            });
            document.getElementById(`tab-${tabName}`).classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });
            document.getElementById(`content-${tabName}`).classList.remove('hidden');

        }

        // API helper functions
        async function apiCall(endpoint, method = 'GET', data = null) {
            const token = localStorage.getItem('think_cnap_token');
            const options = {
                method,
                cache: 'no-store',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            };
            if (data) options.body = JSON.stringify(data);
            
            console.log(`API Call: ${method} /api/admin${endpoint}`, data);
            const response = await fetch(`/api/admin${endpoint}`, options);
            console.log(`API Response: ${response.status}`, response);
            
            if (!response.ok) {
                const error = await response.json();
                console.error('API Error:', error);
                throw new Error(error.error || 'API call failed');
            }
            return response.json();
        }

                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Measure ID</label>
                            <input type="text" name="measure_id" required value="${measure.measure_id}" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Measure</label>
                            <textarea name="measure" rows="3" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white">${measure.measure}</textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Comment</label>
                            <textarea name="comment" rows="2" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white">${measure.comment || ''}</textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Tags</label>
                            <select name="tags" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white">
                                <option value="">Select Tag</option>
                                <option value="aws" ${measure.tags === 'aws' ? 'selected' : ''}>AWS</option>
                                <option value="kubernetes" ${measure.tags === 'kubernetes' ? 'selected' : ''}>Kubernetes</option>
                                <option value="ai" ${measure.tags === 'ai' ? 'selected' : ''}>AI</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Impact</label>
                            <select name="impact" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white">
                                <option value="">Select Impact</option>
                                <option value="low" ${measure.impact === 'low' ? 'selected' : ''}>Low</option>
                                <option value="medium" ${measure.impact === 'medium' ? 'selected' : ''}>Medium</option>
                                <option value="high" ${measure.impact === 'high' ? 'selected' : ''}>High</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Effort</label>
                            <select name="effort" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white">
                                <option value="">Select Effort</option>
                                <option value="low" ${measure.effort === 'low' ? 'selected' : ''}>Low</option>
                                <option value="medium" ${measure.effort === 'medium' ? 'selected' : ''}>Medium</option>
                                <option value="high" ${measure.effort === 'high' ? 'selected' : ''}>High</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Control</label>
                            <select name="control_id" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white">
                                <option value="">Select Control</option>
                                ${controls.map(control => {
                                    const domain = domains.find(d => d.id === control.domain_id);
                                    return `<option value="${control.id}" ${control.id === measure.control_id ? 'selected' : ''}>${domain ? domain.name : 'Unknown'}: ${control.text}</option>`;
                                }).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">MITRE TTPs</label>
                            <div class="max-h-40 overflow-y-auto border border-gray-600 rounded-lg p-2 bg-gray-700">
                                ${ttps.map(ttp => {
                                    const isChecked = measure.linked_ttps && measure.linked_ttps.some(linkedTtp => linkedTtp.id === ttp.id);
                                    return `
                                        <label class="flex items-center space-x-2 p-1 hover:bg-gray-600 rounded">
                                            <input type="checkbox" name="ttp_ids" value="${ttp.id}" ${isChecked ? 'checked' : ''} class="text-purple-600">
                                            <span class="text-sm text-white">${ttp.tactic}: ${ttp.technique}</span>
                                        </label>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                </form>
            `, async () => {
                const form = document.getElementById('measure-form');
                const formData = new FormData(form);
                const controlId = parseInt(formData.get('control_id'), 10);
                if (!Number.isFinite(controlId)) {
                    throw new Error('Please select a control');
                }
                const selectedTtps = Array.from(form.querySelectorAll('input[name="ttp_ids"]:checked')).map(cb => parseInt(cb.value));
                
                const data = {
                    measure_id: formData.get('measure_id'),
                    measure: formData.get('measure'),
                    comment: formData.get('comment') || '',
                    tags: formData.get('tags'),
                    impact: formData.get('impact'),
                    effort: formData.get('effort'),
                    control_id: controlId,
                    ttp_ids: selectedTtps
                };
                await apiCall(`/measures/${id}`, 'PUT', data);
                // Reload measures table to show updated data
                window.adminPanel.loadMeasures();
            });
        }

        async function deleteMeasure(id) {
            if (confirm('Are you sure you want to delete this measure?')) {
                await apiCall(`/measures/${id}`, 'DELETE');
                // Reload measures table to show updated data
                window.adminPanel.loadMeasures();
            }
        }

        // Filter functions with persistence
        function saveFilterState() {
            const domainFilter = document.getElementById('domain-filter');
            const controlFilter = document.getElementById('control-filter');
            const tagFilter = document.getElementById('tag-filter');
            
            const filterState = {
                domain: domainFilter?.value || '',
                control: controlFilter?.value || '',
                tag: tagFilter?.value || ''
            };
            
            localStorage.setItem('admin_filter_state', JSON.stringify(filterState));
        }
        
        function loadFilterState() {
            try {
                const saved = localStorage.getItem('admin_filter_state');
                if (saved) {
                    return JSON.parse(saved);
                }
            } catch (error) {
                console.warn('Failed to load filter state:', error);
            }
            return { domain: '', control: '', tag: '' };
        }
        
        function onDomainFilterChange() {
            const domainFilter = document.getElementById('domain-filter');
            const controlFilter = document.getElementById('control-filter');
            
            if (!window.adminPanel.allControls) return;
            
            // Save filter state
            saveFilterState();
            
            // Update controls dropdown based on selected domain
            if (domainFilter.value) {
                const selectedDomainId = parseInt(domainFilter.value);
                const domainControls = window.adminPanel.allControls.filter(control => 
                    control.domain_id === selectedDomainId
                );
                
                controlFilter.innerHTML = '<option value="">All Controls</option>' +
                    domainControls.map(control => 
                        `<option value="${control.id}">${control.code} - ${control.text}</option>`
                    ).join('');
            } else {
                // Show all controls when no domain is selected
                controlFilter.innerHTML = '<option value="">All Controls</option>' +
                    window.adminPanel.allControls.map(control => 
                        `<option value="${control.id}">${control.code} - ${control.text}</option>`
                    ).join('');
            }
            
            // Reset control filter selection and apply domain filter
            controlFilter.value = '';
            filterMeasures();
        }
        
        function filterMeasures() {
            const domainFilter = document.getElementById('domain-filter');
            const controlFilter = document.getElementById('control-filter');
            const tagFilter = document.getElementById('tag-filter');
            
            if (!window.adminPanel.allMeasures) return;
            
            // Save filter state
            saveFilterState();
            
            let filteredMeasures = window.adminPanel.allMeasures;
            
            // Filter by domain
            if (domainFilter && domainFilter.value) {
                const selectedDomainId = parseInt(domainFilter.value);
                // Find controls that belong to the selected domain
                const domainControls = window.adminPanel.allControls.filter(control => 
                    control.domain_id === selectedDomainId
                );
                const domainControlIds = domainControls.map(control => control.id);
                
                filteredMeasures = filteredMeasures.filter(measure => 
                    domainControlIds.includes(measure.control_id)
                );
            }
            
            // Filter by control
            if (controlFilter && controlFilter.value) {
                const selectedControlId = parseInt(controlFilter.value);
                filteredMeasures = filteredMeasures.filter(measure => 
                    measure.control_id === selectedControlId
                );
            }
            
            // Filter by tag
            if (tagFilter && tagFilter.value) {
                const selectedTag = tagFilter.value;
                filteredMeasures = filteredMeasures.filter(measure => 
                    measure.tags === selectedTag
                );
            }
            
            // Sort by Measure ID
            filteredMeasures.sort((a, b) => (a.measure_id || '').localeCompare(b.measure_id || ''));
            
            // Re-render table with filtered data
            window.adminPanel.renderMeasuresTable(filteredMeasures);
        }

        // Modal utility functions
        function showModal(title, content, onSave) {
            // Close any existing modals first
            const existingModals = document.querySelectorAll('.fixed.inset-0');
            existingModals.forEach(modal => {
                if (modal.id !== 'loading') {
                    modal.remove();
                }
            });
            
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
            
            const saveButton = onSave ? `
                <button onclick="handleModalSave(this)" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
                    Save
                </button>
            ` : '';
            
            const cancelButtonText = onSave ? 'Cancel' : 'Close';
            
            modal.innerHTML = `
                <div class="bg-gray-800 rounded-lg shadow-2xl ${onSave ? 'max-w-2xl' : 'max-w-4xl'} w-full mx-4 max-h-[90vh] overflow-y-auto">
                    <div class="flex items-center justify-between p-6 border-b border-gray-700">
                        <h3 class="text-xl font-semibold text-cyan-400">${title}</h3>
                        <button onclick="this.closest('.fixed').remove()" class="text-gray-400 hover:text-white text-2xl">×</button>
                    </div>
                    <div class="p-6">
                        ${content}
                    </div>
                    <div class="flex justify-end space-x-3 p-6 border-t border-gray-700">
                        <button onclick="this.closest('.fixed').remove()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg">
                            ${cancelButtonText}
                        </button>
                        ${saveButton}
                    </div>
                </div>
            `;
            modal.onSave = onSave;
            document.body.appendChild(modal);
        }

        async function handleModalSave(button) {
            const modal = button.closest('.fixed');
            try {
                button.disabled = true;
                button.textContent = 'Saving...';
                await modal.onSave();
                modal.remove();
                window.adminPanel.loadTabContent(window.adminPanel.currentTab);
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                button.disabled = false;
                button.textContent = 'Save';
            }
        }

        // Admin sign out function
        function adminSignOut() {
            // Clear session data
            localStorage.removeItem('think_cnap_token');
            localStorage.removeItem('think_cnap_user');
            
            // Hide dropdown
            hideAdminUserDropdown();
            
            // Redirect to main page with sign-in prompt using current domain
            const currentDomain = window.location.origin;
            window.location.href = `${currentDomain}/?signin=true`;
        }

        // Admin dropdown functions
        function toggleAdminUserDropdown() {
            const dropdown = document.getElementById('admin-user-dropdown-menu');
            const arrow = document.getElementById('admin-dropdown-arrow');
            
            if (dropdown) {
                const isHidden = dropdown.classList.contains('hidden');
                
                if (isHidden) {
                    dropdown.classList.remove('hidden');
                    if (arrow) arrow.style.transform = 'rotate(180deg)';
                } else {
                    dropdown.classList.add('hidden');
                    if (arrow) arrow.style.transform = 'rotate(0deg)';
                }
            }
        }

        function hideAdminUserDropdown() {
            const dropdown = document.getElementById('admin-user-dropdown-menu');
            const arrow = document.getElementById('admin-dropdown-arrow');
            
            if (dropdown) {
                dropdown.classList.add('hidden');
                if (arrow) arrow.style.transform = 'rotate(0deg)';
            }
        }

        function handleAdminClickOutside(event) {
            const dropdown = document.getElementById('admin-user-dropdown-menu');
            const button = document.getElementById('admin-user-dropdown-button');
            
            if (dropdown && button && 
                !dropdown.contains(event.target) && 
                !button.contains(event.target)) {
                hideAdminUserDropdown();
            }
        }

        // Initialize admin panel
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize auth for sign out functionality
            window.auth = new ThinkCNAPAuth();
            window.adminPanel = new AdminPanel();
        });
    </script>

    <style>
        .admin-tab {
            @apply flex items-center px-4 py-2 text-sm font-medium text-gray-400 hover:text-white hover:bg-gray-700 rounded-lg transition-colors;
        }
        
        .admin-tab.active {
            @apply text-cyan-400 bg-gray-700;
        }
        
        .tab-content {
            @apply transition-opacity duration-200;
        }
    </style>
</body>
</html>
