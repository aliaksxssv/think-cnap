{{- if and .Values.database.password (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "think-cnap.fullname" . }}-db-secret
  labels:
    {{- include "think-cnap.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.database.password | quote }}
{{- else if .Values.database.existingSecret }}
# Using existing secret: {{ .Values.database.existingSecret }}
{{- else }}
{{- fail "\n\n❌ ERROR: database.password is required!\n\nSet it in values.yaml:\n  database:\n    password: \"your-secure-password\"\n\nOr use an existing Kubernetes secret:\n  database:\n    existingSecret: \"my-db-secret\"\n\nFor production, create secret manually:\n  kubectl create secret generic my-db-secret --from-literal=password='your-secure-password'\n\nSee SECURITY.md for more information.\n" }}
{{- end }}
