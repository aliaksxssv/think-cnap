{{- if and .Values.persistence.enabled .Values.persistence.deleteOnUninstall }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "think-cnap.fullname" . }}-pvc-cleanup
  labels:
    {{- include "think-cnap.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "think-cnap.fullname" . }}-pvc-cleanup
  labels:
    {{- include "think-cnap.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "think-cnap.fullname" . }}-pvc-cleanup
  labels:
    {{- include "think-cnap.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ include "think-cnap.fullname" . }}-pvc-cleanup
roleRef:
  kind: Role
  name: {{ include "think-cnap.fullname" . }}-pvc-cleanup
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "think-cnap.fullname" . }}-pvc-cleanup
  labels:
    {{- include "think-cnap.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        {{- include "think-cnap.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "think-cnap.fullname" . }}-pvc-cleanup
      containers:
        - name: kubectl
          image: bitnami/kubectl:1.28
          command:
            - /bin/sh
            - -c
            - |
              kubectl delete pvc {{ include "think-cnap.fullname" . }}-pvc --ignore-not-found
{{- end }}
