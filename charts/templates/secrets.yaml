{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.jwtSecret }}
{{- fail "\n\n❌ ERROR: secrets.jwtSecret is required!\n\nSet it in values.yaml:\n  secrets:\n    jwtSecret: \"your-strong-jwt-secret\"\n\nOr use an existing Kubernetes secret:\n  secrets:\n    existingSecret: \"think-cnap-secrets\"\n\n" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "think-cnap.fullname" . }}-secrets
  labels:
    {{- include "think-cnap.labels" . | nindent 4 }}
type: Opaque
data:
  jwtSecret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  googleClientId: {{ .Values.secrets.googleClientId | b64enc | quote }}
{{- end }}
