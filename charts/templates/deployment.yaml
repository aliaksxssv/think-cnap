apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "think-cnap.fullname" . }}
  labels:
    {{- include "think-cnap.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "think-cnap.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "think-cnap.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: database-storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "think-cnap.fullname" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
      containers:
        # App container
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: DB_HOST
              value: "localhost"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: {{ .Values.database.name | default "thinkcnap" | quote }}
            - name: DB_USER
              value: {{ .Values.database.user | default "thinkcnap" | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.database.existingSecret }}{{ .Values.database.existingSecret }}{{ else }}{{ include "think-cnap.fullname" . }}-db-secret{{ end }}
                  key: password
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.existingSecret }}{{ .Values.secrets.existingSecret }}{{ else }}{{ include "think-cnap.fullname" . }}-secrets{{ end }}
                  key: googleClientId
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.existingSecret }}{{ .Values.secrets.existingSecret }}{{ else }}{{ include "think-cnap.fullname" . }}-secrets{{ end }}
                  key: jwtSecret
            # Note: GOOGLE_CLIENT_ID is also injected into HTML files at runtime via inject-env.sh
          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext.app | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
        # Database container (PostgreSQL)
        - name: database
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | default "thinkcnap" }}
            - name: POSTGRES_USER
              value: {{ .Values.database.user | default "thinkcnap" }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.database.existingSecret }}{{ .Values.database.existingSecret }}{{ else }}{{ include "think-cnap.fullname" . }}-db-secret{{ end }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: MIGRATIONS_DIR
              value: "/migrations"
            - name: SEED_DATA_DIR
              value: "/seed-data"
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: database-storage
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.resources.database | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext.database | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U {{ .Values.database.user | default "thinkcnap" }} -d {{ .Values.database.name | default "thinkcnap" }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U {{ .Values.database.user | default "thinkcnap" }} -d {{ .Values.database.name | default "thinkcnap" }}
            initialDelaySeconds: 10
            periodSeconds: 5
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
