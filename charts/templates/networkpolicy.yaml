{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "think-cnap.fullname" . }}
  labels:
    {{- include "think-cnap.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "think-cnap.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: {{ .Release.Namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    - {}  # Allow all egress (can be restricted further)
{{- end }}
