# Default values for think-cnap
replicaCount: 1

image:
  repository: ghcr.io/aliaksxssv/think-cnap
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

database:
  image:
    repository: ghcr.io/aliaksxssv/think-cnap-db
    pullPolicy: IfNotPresent
    tag: "latest"
  name: "thinkcnap"
  user: "thinkcnap"
  # REQUIRED: Set password or use existing secret
  # Option 1: Set password directly (not recommended for production)
  password: ""  # REQUIRED: Must be set!
  # Option 2: Use existing Kubernetes secret (recommended for production)
  # existingSecret: "my-db-secret"  # Secret must have 'password' key
  port: 5432

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 500Mi
  mountPath: "/var/lib/postgresql/data"

resources:
  app:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  database:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations: {}

networkPolicy:
  enabled: false  # Enable for production to restrict network access

podSecurityContext:
  fsGroup: 999  # PostgreSQL group ID
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  app:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false  # App needs write access for logs
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  database:
    runAsNonRoot: true
    runAsUser: 999  # PostgreSQL user ID
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false  # PostgreSQL needs write access
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

env:
  NODE_ENV: "production"
  PORT: "8080"
  # Database connection variables are set automatically from database.* values
  # DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD are configured in deployment.yaml
