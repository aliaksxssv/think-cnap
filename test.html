<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThinkCNAP Header Logo Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: #0b1220;
        color: #e5e7eb;
      }
      .logo-outline {
        fill: none;
        stroke: #0b0b0b;
        stroke-width: 10;
        stroke-linejoin: round;
      }
      .logo-edges {
        stroke: #0b0b0b;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .logo-fill {
        fill: #f8d35a;
        stroke: #0b0b0b;
        stroke-width: 8;
        stroke-linejoin: round;
      }
      .logo-fill-accent {
        fill: #f2a024;
        stroke: #0b0b0b;
        stroke-width: 6;
        stroke-linejoin: round;
      }
      .logo-node {
        fill: #f28b30;
        stroke: #0b0b0b;
        stroke-width: 7;
      }
    </style>
  </head>
  <body class="p-6">
    <div class="max-w-5xl mx-auto">
      <header class="flex items-start gap-6">
        <div class="bg-slate-900/70 rounded-xl p-4 shadow-lg">
          <svg
            width="220"
            height="220"
            viewBox="0 0 200 200"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="Pentagon logo"
            role="img"
          >
            <!-- Outer pentagon frame -->
            <polygon
              class="logo-outline"
              points="100,18 182,75 150,182 50,182 18,75"
            />

            <!-- Inner filled pentagon -->
            <polygon
              class="logo-fill"
              points="100,52 146,82 130,142 70,142 54,88"
            />

            <!-- Accent wedge -->
            <polygon
              class="logo-fill-accent"
              points="132,90 146,98 136,132 122,118"
            />

            <!-- Connecting edges -->
            <line class="logo-edges" x1="100" y1="52" x2="100" y2="120" />
            <line class="logo-edges" x1="100" y1="120" x2="68" y2="80" />
            <line class="logo-edges" x1="100" y1="120" x2="146" y2="82" />
            <line class="logo-edges" x1="68" y1="80" x2="146" y2="82" />
            <line class="logo-edges" x1="68" y1="80" x2="70" y2="142" />
            <line class="logo-edges" x1="146" y1="82" x2="130" y2="142" />
            <line class="logo-edges" x1="70" y1="142" x2="100" y2="120" />
            <line class="logo-edges" x1="130" y1="142" x2="100" y2="120" />

            <!-- Nodes -->
            <circle class="logo-node" cx="100" cy="52" r="12" />
            <circle class="logo-node" cx="68" cy="80" r="12" />
            <circle class="logo-node" cx="146" cy="82" r="12" />
            <circle class="logo-node" cx="70" cy="142" r="12" />
            <circle class="logo-node" cx="130" cy="142" r="12" />
          </svg>
        </div>

        <div class="pt-2">
          <h1 class="text-2xl font-semibold text-sky-200">ThinkCNAP</h1>
          <p class="text-slate-300 max-w-xl">
            Header logo test with a radar chart base and level markers. This is a standalone
            preview only; it does not modify the app.
          </p>
          <div class="mt-3 text-sm text-slate-400">
            Adjust the polygon points, ring sizes, or badge values to match your design.
          </div>
        </div>
      </header>
    </div>
  </body>
</html>
